name: P1 Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
# Keep only the newest main-branch APK build.
concurrency:
  group: p1-kairo-test-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner includes the Android command-line SDK.
      # Avoid setup-android: it failed before Gradle started on this runner.
      - name: Configure Android SDK and native build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found on runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P1-KAIRO-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download testing APK (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk KAIRO-P1-testing.apk
          if gh release view p1-kairo-testing >/dev/null 2>&1; then
            gh release upload p1-kairo-testing KAIRO-P1-testing.apk --clobber
          else
            gh release create p1-kairo-testing KAIRO-P1-testing.apk \
              --title "KAIRO P1 testing APK (not production)" \
              --notes "Installable debug build for testing. The custom ONNX model and reliable speaker authentication are not yet included. CI debug builds may use different signing keys; if Android refuses the update, uninstall the previous P1 test app and install again. This clears its saved app settings." \
              --prerelease
          fi
