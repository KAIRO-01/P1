
name: Extract JARVIS Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip JARVIS Source
        run: |
          set -e
          unzip -q jarvis-android-main.zip -d extracted
          cp -a extracted/jarvis-android-main/. .
          rm -rf extracted
          rm jarvis-android-main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract JARVIS source"
          git push
          
