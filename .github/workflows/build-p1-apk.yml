name: Build P1 KAIRO APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-p1-apk.yml"
      - "app/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

# Only spend CI time on the newest P1 preview while code is being updated.
concurrency:
  group: kairo-p1-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout P1
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled GitHub runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install native Android build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Restore stable preview signing key when configured
        env:
          KEY_B64: ${{ secrets.KAIRO_PREVIEW_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.KAIRO_PREVIEW_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAIRO_PREVIEW_ALIAS }}
          KEY_ENTRY_PASS: ${{ secrets.KAIRO_PREVIEW_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEY_B64" && -n "$KEY_PASS" ]]; then
            printf "%s" "$KEY_B64" | base64 -d > "$RUNNER_TEMP/kairo-preview.jks"
            echo "KAIRO_PREVIEW_KEYSTORE=$RUNNER_TEMP/kairo-preview.jks" >> "$GITHUB_ENV"
            echo "KAIRO_PREVIEW_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "KAIRO_PREVIEW_ALIAS=${KEY_ALIAS:-kairo}" >> "$GITHUB_ENV"
            echo "KAIRO_PREVIEW_KEY_PASSWORD=${KEY_ENTRY_PASS:-$KEY_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::Temporary debug signer. This preview will install beside KAIRO but future previews may not update in place."
          fi
      - name: Test order parsing and core logic
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build KAIRO APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: P1-KAIRO-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download (preview)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="p1-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#P1-KAIRO-preview.apk" \
            --target "$GITHUB_SHA" --title "P1 KAIRO APK Preview #${GITHUB_RUN_NUMBER}" --prerelease \
            --notes "KAIRO OAuth Setup installs separately (app.shilex.android.p1.preview.oauthdialog), preserving original KAIRO and older preview data. Show app signing SHA-1 in KAIRO Sheets Test Settings > Google Sheets > OAuth setup details. Private Google Sheets need owner consent plus Android OAuth client setup for this exact package and signing certificate. Missing OAuth setup cannot be fixed by code alone. Preview key is temporary unless GitHub secrets configure a stable signer. Never uninstall original KAIRO to install this preview. Real-phone GPS and voice verification still require testing."
